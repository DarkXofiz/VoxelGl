name: Build VoxelGL

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoxelGL-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK/NDK (preinstalled SDK)
        shell: bash {0}
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | $SDKM --licenses > /dev/null
          $SDKM "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null
          echo "sdkmanager exit: $?"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VoxelGL-debug-apk
          path: VoxelGL-plugin/app/build/outputs/apk/debug/*.apk
